name: One-shot native serial parallel diagnosis
run-name: Native paired diagnosis / ${{ github.sha }}
on:
  push:
    branches: [codex/native-pair-diagnostic]
permissions: {}
concurrency:
  group: nearly-one-shot-native-pair
  cancel-in-progress: false
jobs:
  paired:
    if: github.repository == 'nea-c/Nearly' && github.event_name == 'push' && github.event.created == true && github.ref == 'refs/heads/codex/native-pair-diagnostic'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_TERM_VERBOSE: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cc0a659d56a998ca69976955d986539b87f2da9a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Verify exact measured source and prepare existing pinned tools
        run: |
          if ((git -C source rev-parse HEAD) -cne 'cc0a659d56a998ca69976955d986539b87f2da9a') { throw 'Source mismatch' }
          ./source/.github/scripts/prepare-signing-tools.ps1 -Destination "$env:RUNNER_TEMP/nearly-build-extractor"
          ./source/.github/scripts/prepare-windows.ps1 -SourceRoot ./source
      - name: Locked npm with phase timing only
        working-directory: source
        run: |
          npm ci --timing --logs-dir "$env:RUNNER_TEMP/nearly-npm-timing/_logs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned Rust and locked dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 fetch --locked --manifest-path source/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnostic runner contracts
        run: node --test diagnostic/.github/scripts/native-pair-diagnostic.test.mjs
      - id: deps-context
        name: Existing main-compatible read-only cache identity
        continue-on-error: true
        run: node source/.github/scripts/dependency-cache.mjs prepare native-debug source/src-tauri
      - id: deps-restore
        if: steps.deps-context.outputs.enabled == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ${{ steps.deps-context.outputs.path }}
          key: ${{ steps.deps-context.outputs.key }}
      - name: Validate cache or use cold build without saving
        if: steps.deps-context.outputs.enabled == 'true'
        continue-on-error: true
        env:
          CACHE_MATCHED_KEY: ${{ steps.deps-restore.outputs.cache-matched-key }}
        run: node source/.github/scripts/dependency-cache.mjs restore native-debug
      - name: Full Node contracts and generated native fixture prerequisites
        working-directory: source
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ppk-fixtures.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One native build then serial parallel parallel serial
        run: node diagnostic/.github/scripts/native-pair-diagnostic.mjs source "$env:RUNNER_TEMP/native-pair-results"
      - name: Diagnostic counters and summaries only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-pair-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-pair-results/result.json
            ${{ runner.temp }}/native-pair-results/telemetry.jsonl
          if-no-files-found: warn
          retention-days: 1
