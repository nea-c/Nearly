name: Manual isolated Windows installer QA
run-name: Installer QA / ${{ inputs.controller_sha }}
on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Exact reviewed controller SHA, matching this workflow commit
        type: string
        required: true
      confirmation:
        description: Type installer-qa followed by a space and the exact controller SHA
        type: string
        required: true
      diagnosis_only:
        description: Read only existing hosted fixed drive root metadata without installer preparation
        type: boolean
        default: false
      diagnose_windows_2022:
        description: Use the existing Windows 2022 image for read-only root diagnosis only
        type: boolean
        default: false
      root_coverage_only:
        description: Qualify only the explicit C-drive root child without changing any drive permissions
        type: boolean
        default: false
permissions: {}
concurrency:
  group: nearly-manual-installer-qa
  cancel-in-progress: false
jobs:
  root-diagnosis:
    name: Read-only hosted drive root diagnosis
    if: inputs.diagnosis_only && github.repository == 'nea-c/Nearly' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/private-install-directory')
    runs-on: ${{ inputs.diagnose_windows_2022 && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      QA_CONTROLLER_SHA: ${{ inputs.controller_sha }}
      QA_CONFIRMATION: ${{ inputs.confirmation }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require exact manual confirmation before root metadata reads
        run: |
          node --input-type=module -e "import {validateContext} from './scripts/installer-qa.mjs'; validateContext(process.env);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read only bounded existing fixed drive roots
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          . ./scripts/installer-qa-root-inventory.ps1
          $inventory=Get-NearlyHostedRootInventory
          Write-Host (ConvertTo-Json -InputObject $inventory -Depth 8 -Compress)
          if (!$inventory.complete) { throw 'Root inventory incomplete; no admission or qualification result' }
  guest:
    name: Fresh guest / ${{ matrix.phase || 'candidate' }} / ${{ matrix.scenario }} / ${{ matrix.destination }}
    if: github.repository == 'nea-c/Nearly' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/private-install-directory') && !inputs.diagnosis_only
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        phase: [candidate]
        scenario: [success, health-failure]
        destination: ${{ fromJSON(inputs.root_coverage_only && '["drive-c"]' || '["default","custom","drive"]') }}
        include: ${{ fromJSON(inputs.root_coverage_only && '[]' || '[{"phase":"production","scenario":"success","destination":"default"}]') }}
    permissions:
      contents: read
      actions: read
    env:
      QA_CONTROLLER_SHA: ${{ inputs.controller_sha }}
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      QA_SCENARIO: ${{ matrix.scenario }}
      QA_DESTINATION: ${{ matrix.destination }}
      QA_COMMAND: ${{ matrix.phase == 'production' && 'production' || 'run' }}
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require exact manual confirmation before guest preparation
        id: authorized
        run: |
          node --input-type=module -e "import {validateContext,validateScenario} from './scripts/installer-qa.mjs'; validateContext(process.env); validateScenario(process.env.QA_SCENARIO);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Safe orchestration, UI policy and evidence unit tests
        run: node --test tests/installer-qa.test.mjs tests/installer-ui.test.mjs tests/installer-evidence.test.mjs tests/installer-standard-user.test.mjs tests/installer-passive-observer.test.mjs tests/installer-failure-diagnostic.test.mjs tests/installer-drive-diagnosis.test.mjs
      - name: Prove standard-user guest startup before dependency preparation
        run: node scripts/installer-qa.mjs preflight
      - name: Prepare pinned cached NSIS tools without installing any runtime
        run: ./.github/scripts/prepare-windows.ps1 -SourceRoot .
      - name: Prove actual temporary plugin namespace admission before building
        run: node scripts/installer-qa.mjs guard-probe
      - name: Prepare locked build dependencies in this fresh guest
        if: matrix.phase != 'production'
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify actual destination and shortcut UI plus ephemeral QA update/restart/recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/installer-qa.mjs $env:QA_COMMAND
      - name: Export only validated public screenshots and bounded result records
        id: evidence
        if: always() && steps.authorized.outcome == 'success'
        run: node scripts/installer-qa-evidence.mjs
      - name: Retain actual UI evidence without fixture binaries or credentials
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nearly-installer-ui-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}-${{ matrix.destination }}-${{ matrix.phase || 'candidate' }}
          path: ${{ runner.temp }}/nearly-installer-qa-${{ github.run_id }}-${{ github.run_attempt }}/public-evidence/
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      # No Release, production signing, cache, deployment or secret-bearing step.
      # Fixture binaries, settings and authorization remain only on the guest.
