name: Nearly r3.3 candidate validation and artifacts
run-name: Nearly r3.3 candidate / ${{ github.sha }}
on:
  push:
    branches: [codex/r33-candidate]
  workflow_dispatch:
permissions: {}
concurrency:
  group: nearly-r33-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ github.sha }}
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_MODE: validate
  RELEASE_TAG: r3.3
  RELEASE_CONFIRM: ''
jobs:
  policy:
    if: github.repository == 'nea-c/Nearly' && github.ref == 'refs/heads/codex/r33-candidate' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require exact candidate identity without signing or publication
        run: node control/.github/scripts/candidate-build.mjs context
  browser-ui:
    needs: policy
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source-commit: ${{ steps.verified.outputs.source-commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Audit exact candidate source, public ancestry, version and production gate
        run: node control/.github/scripts/candidate-build.mjs preflight source
      - name: Install locked target dependencies in this secret-free runner
        working-directory: source
        run: npm ci
      - name: Browser regression and production UI checks
        working-directory: source
        run: |
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui:production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: verified
        name: Reaudit tested source and bind successful checks to the exact commit
        run: |
          node control/.github/scripts/candidate-build.mjs preflight source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceCommit = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "source-commit=$sourceCommit" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  unsigned-build:
    needs: policy
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
      source-commit: ${{ steps.package.outputs.source-commit }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Audit exact candidate source, public ancestry, version and production gate
        run: node control/.github/scripts/candidate-build.mjs preflight source
      - name: Prepare reviewed portable tools before target builds and tests
        run: |
          ./control/.github/scripts/prepare-signing-tools.ps1 -Destination "$env:RUNNER_TEMP/nearly-build-extractor"
          ./control/.github/scripts/prepare-windows.ps1 -SourceRoot ./source
      - name: Install locked target dependencies in this secret-free runner
        working-directory: source
        run: npm ci
      - name: Select pinned Rust and fetch locked dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 fetch --locked --manifest-path source/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test trusted release controller with existing locked test dependencies
        env:
          NEARLY_TEST_DEPENDENCY_ROOT: ${{ github.workspace }}/source
        run: node --test control/tests/manual-release.test.mjs control/tests/manual-release-workflow.test.mjs control/tests/signed-*.test.mjs
      - name: Model, TypeScript and installer compile contracts
        working-directory: source
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate disposable keys for isolated native fixtures
        working-directory: source
        run: node scripts/ppk-fixtures.mjs
      - name: Native tests, excluding explicit manual qualification cases
        working-directory: source
        run: cargo +1.97.1 test --offline --locked --manifest-path src-tauri/Cargo.toml -- --skip install_root::native::tests::ordinary_inherited_namespace_is_admitted_by_production_validation --skip install_root::native::tests::generated_custom_root_payload_current_identity_and_namespace_guards --test-threads=1
      - name: Standard-user installation admission tests
        working-directory: source
        run: ../control/.github/scripts/candidate-native-admission.ps1
      - name: Generated localhost SFTP fixtures
        working-directory: source
        run: |
          node scripts/sync-difference-test.mjs sync_difference_generated_localhost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sync-difference-test.mjs directory_deletion_generated_localhost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build production NSIS without running setup
        working-directory: source
        run: npm run build:installer -- --offline --locked
      - id: package
        name: Reaudit and bind final installer plus final loose application
        run: node control/.github/scripts/candidate-build.mjs package source "$env:RUNNER_TEMP/nearly-unsigned"

      - id: upload
        name: Retain unsigned candidate review artifacts without publishing a Release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nearly-r3.3-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nearly-unsigned/*
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 7

  validation-result:
    needs: [browser-ui, unsigned-build]
    if: always() && github.repository == 'nea-c/Nearly' && github.ref == 'refs/heads/codex/r33-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful tests and artifacts bound to this candidate SHA
        env:
          BROWSER_RESULT: ${{ needs.browser-ui.result }}
          BUILD_RESULT: ${{ needs.unsigned-build.result }}
          BROWSER_SOURCE: ${{ needs.browser-ui.outputs.source-commit }}
          BUILD_SOURCE: ${{ needs.unsigned-build.outputs.source-commit }}
          MANIFEST_SHA256: ${{ needs.unsigned-build.outputs.manifest-sha256 }}
        run: node -e "if(process.env.BROWSER_RESULT!=='success'||process.env.BUILD_RESULT!=='success'||process.env.BROWSER_SOURCE!==process.env.CANDIDATE_SHA||process.env.BUILD_SOURCE!==process.env.CANDIDATE_SHA||!/^[a-f0-9]{64}$/.test(process.env.MANIFEST_SHA256||''))process.exit(1)"
