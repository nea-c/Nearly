name: PR parallel release validation
run-name: Parallel release validation / ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/release-signed-windows.yml
      - .github/workflows/parallel-release-validation.yml
      - .github/scripts/parallel-release-validation.mjs
      - .github/scripts/parallel-native-admission.ps1
      - tests/signed-workflow.test.mjs
      - tests/signed-parallel-validation.test.mjs
permissions: {}
concurrency:
  group: nearly-parallel-release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  RELEASE_MODE: validate
  RELEASE_COMMIT: ${{ github.event.pull_request.base.sha }}
  RELEASE_TAG: r3.2
  RELEASE_CONFIRM: ''
  VALIDATION_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  VALIDATION_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
jobs:
  policy:
    if: github.repository == 'nea-c/Nearly' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'nea-c/Nearly' && github.event.pull_request.head.ref == 'codex/parallel-release-ui-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind same-repository PR controller and main base source without release identity
        run: node control/.github/scripts/parallel-release-validation.mjs context
  browser-ui:
    needs: policy
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source-commit: ${{ steps.verified.outputs.source-commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Audit clean source, main ancestry, canonical version and registered production gate
        run: node control/.github/scripts/parallel-release-validation.mjs preflight source
      - name: Install locked target dependencies in this secret-free runner
        working-directory: source
        run: npm ci
      - name: Browser regression and production UI checks
        working-directory: source
        run: |
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui:production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: verified
        name: Reaudit tested source and bind successful checks to the exact commit
        run: |
          node control/.github/scripts/parallel-release-validation.mjs preflight source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceCommit = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "source-commit=$sourceCommit" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  unsigned-build:
    needs: policy
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Audit clean source, main ancestry, canonical version and registered production gate
        run: node control/.github/scripts/parallel-release-validation.mjs preflight source
      - name: Prepare reviewed portable tools before target builds and tests
        run: |
          ./control/.github/scripts/prepare-signing-tools.ps1 -Destination "$env:RUNNER_TEMP/nearly-build-extractor"
          ./control/.github/scripts/prepare-windows.ps1 -SourceRoot ./source
      - name: Install locked target dependencies in this secret-free runner
        working-directory: source
        run: npm ci
      - name: Select pinned Rust and fetch locked dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 fetch --locked --manifest-path source/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test trusted release controller with existing locked test dependencies
        env:
          NEARLY_TEST_DEPENDENCY_ROOT: ${{ github.workspace }}/source
        run: node --test control/tests/manual-release.test.mjs control/tests/manual-release-workflow.test.mjs control/tests/signed-*.test.mjs
      - name: Model, TypeScript and installer compile contracts
        working-directory: source
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate disposable keys for isolated native fixtures
        working-directory: source
        run: node scripts/ppk-fixtures.mjs
      - name: Native tests, excluding explicit manual qualification cases
        working-directory: source
        run: cargo +1.97.1 test --offline --locked --manifest-path src-tauri/Cargo.toml -- --skip install_root::native::tests::ordinary_inherited_namespace_is_admitted_by_production_validation --skip install_root::native::tests::generated_custom_root_payload_current_identity_and_namespace_guards --test-threads=1
      - name: Standard-user installation admission tests
        working-directory: source
        run: ../control/.github/scripts/parallel-native-admission.ps1
      - name: Generated localhost SFTP fixtures
        working-directory: source
        run: |
          node scripts/sync-difference-test.mjs sync_difference_generated_localhost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sync-difference-test.mjs directory_deletion_generated_localhost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build production NSIS without running setup
        working-directory: source
        run: npm run build:installer -- --offline --locked
      - id: package
        name: Reaudit and bind final installer plus final loose application
        run: node control/.github/scripts/parallel-release-validation.mjs package source "$env:RUNNER_TEMP/nearly-unsigned"

  validation-result:
    needs: [browser-ui, unsigned-build]
    if: always() && (github.repository == 'nea-c/Nearly' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'nea-c/Nearly' && github.event.pull_request.head.ref == 'codex/parallel-release-ui-local')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both checks and the exact base source
        env:
          BROWSER_RESULT: ${{ needs.browser-ui.result }}
          BUILD_RESULT: ${{ needs.unsigned-build.result }}
          BROWSER_SOURCE: ${{ needs.browser-ui.outputs.source-commit }}
        run: node -e "if(process.env.BROWSER_RESULT!=='success'||process.env.BUILD_RESULT!=='success'||process.env.BROWSER_SOURCE!==process.env.RELEASE_COMMIT)process.exit(1)"
