[package]
name = "nearly-updater-signer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
minisign = "=0.9.1"
base64 = "=0.22.1"
blake2 = "=0.11.0"
ring = "=0.17.14"
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "=7.4.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
