[package]
name = "nearly-updater-key-registrar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.22.1"
crypto_box = { version = "=0.9.1", features = ["seal"] }
curve25519-dalek = "=4.1.3"
getrandom = "=0.4.2"
minisign = "=0.9.1"
nearly-updater-signer = { path = "../updater-signer" }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
