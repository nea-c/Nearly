[package]
name = "nearly"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "=0.3.4"
dunce = "1"
notify = "8"
ignore = "=0.4.33"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = "0.16"
zeroize = { version = "1", features = ["serde"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs"] }
futures-util = "0.3"
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Security", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
bytes = "1"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"

[patch.crates-io]
russh-sftp = { path = "vendor/russh-sftp" }
