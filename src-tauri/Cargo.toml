[package]
name = "nearly"
version = "3.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
semver = "=1.0.28"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "=0.3.4"
ring = "=0.17.14"
blake2 = "=0.11.0"
dunce = "1"
notify = "8"
ignore = "=0.4.33"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = "0.16"
zeroize = { version = "1", features = ["serde"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs"] }
futures-util = "0.3"
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Security", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
installer-qa = []

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.61.2"
webview2-core = { package = "windows-core", version = "=0.62.2" }

[dev-dependencies]
bytes = "1"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"

[patch.crates-io]
russh-sftp = { path = "vendor/russh-sftp" }
